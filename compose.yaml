name: cloudlicense

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: "${CLOUDLICENSE_DB_NAME:-cloudlicense}"
      POSTGRES_USER: "${CLOUDLICENSE_DB_USER:-cloudlicense}"
      POSTGRES_PASSWORD: "${CLOUDLICENSE_DB_PASSWORD:?set CLOUDLICENSE_DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      CLOUDLICENSE_PORT: "8080"
      CLOUDLICENSE_DB_URL: "jdbc:postgresql://postgres:5432/${CLOUDLICENSE_DB_NAME:-cloudlicense}"
      CLOUDLICENSE_DB_USER: "${CLOUDLICENSE_DB_USER:-cloudlicense}"
      CLOUDLICENSE_DB_PASSWORD: "${CLOUDLICENSE_DB_PASSWORD:?set CLOUDLICENSE_DB_PASSWORD in .env}"
      CLOUDLICENSE_SCHEMA: classpath:schema-postgres.sql
      CLOUDLICENSE_ADMIN_KEY: "${CLOUDLICENSE_ADMIN_KEY:?set CLOUDLICENSE_ADMIN_KEY in .env}"
      CLOUDLICENSE_LICENSE_PEPPER: "${CLOUDLICENSE_LICENSE_PEPPER:?set CLOUDLICENSE_LICENSE_PEPPER in .env}"
      CLOUDLICENSE_STORAGE_ROOT: /app/storage
      CLOUDLICENSE_NATIVE_LIBRARY: /app/native/libcloudlicense_obfuscator.so
      CLOUDLICENSE_TRUST_FORWARDED_FOR: "${CLOUDLICENSE_TRUST_FORWARDED_FOR:-false}"
      CLOUDLICENSE_VERIFY_RATE_LIMIT: "${CLOUDLICENSE_VERIFY_RATE_LIMIT:-120}"
      CLOUDLICENSE_ALLOWED_ORIGINS: "${CLOUDLICENSE_PUBLIC_ORIGIN:-http://localhost:5173}"
    volumes:
      - ./runtime/storage:/app/storage
    expose:
      - "8080"
    ports:
      - "${CLOUDLICENSE_API_PORT:-2345}:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/public/plugins"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    environment:
      CLOUDLICENSE_SITE_ADDRESS: "${CLOUDLICENSE_SITE_ADDRESS:-:80}"
    ports:
      - "${CLOUDLICENSE_WEB_HTTP_PORT:-5173}:80"
      - "${CLOUDLICENSE_WEB_HTTPS_PORT:-5443}:443"
      - "${CLOUDLICENSE_WEB_HTTPS_PORT:-5443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
