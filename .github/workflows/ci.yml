name: CloudLicense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean test
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build backend image (Spring Boot + JNI)
        run: docker build --pull -f deploy/backend.Dockerfile -t cloudlicense-backend:ci .
      - name: Build frontend image (Vue + Caddy)
        run: docker build --pull -f deploy/frontend.Dockerfile -t cloudlicense-web:ci .
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e CLOUDLICENSE_SITE_ADDRESS=:80 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
