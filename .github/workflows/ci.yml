name: CloudLicense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build JNI transformer for integration tests
        run: |
          cmake -S native-obfuscator -B native-obfuscator/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-obfuscator/build --config Release --parallel
      - name: Run Maven tests
        env:
          CLOUDLICENSE_NATIVE_LIBRARY: ${{ github.workspace }}/native-obfuscator/build/libcloudlicense_obfuscator.so
        run: |
          chmod +x mvnw
          ./mvnw -B clean test
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build backend image (Spring Boot + JNI)
        run: docker build --pull -f deploy/backend.Dockerfile -t cloudlicense-backend:ci .
      - name: Smoke-test PostgreSQL-backed API
        run: |
          trap 'docker compose --env-file .env.example logs --tail=200 postgres backend || true; docker compose --env-file .env.example down -v --remove-orphans' EXIT
          docker compose --env-file .env.example up -d postgres backend
          for attempt in $(seq 1 60); do
            if docker compose --env-file .env.example exec -T backend \
                curl --fail --silent http://127.0.0.1:8080/api/v1/public/plugins >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Build frontend image (Vue + Caddy)
        run: docker build --pull -f deploy/frontend.Dockerfile -t cloudlicense-web:ci .
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e CLOUDLICENSE_SITE_ADDRESS=:80 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
